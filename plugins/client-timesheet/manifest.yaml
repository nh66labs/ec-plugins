# Client timesheet: keeps the monthly timesheet a client asks for, for the
# company's employees placed there (docs/design/client-timesheet.md in the
# platform). Its capability is the platform's own build; this file only names it.
#
# Added to the Space that serves the client. It names the client's Jira (as the
# project-management plugin does) and, from step 3, the HRMS server's leave read
# (as the HRMS plugin does). Two plugins may name one server, so neither of
# those plugins changes.
#
# It grows with the build: a manifest naming a tool the build doesn't carry is
# refused at install, so each part is named here only once the platform has it.
#   0.1.0    the client's Jira, and the roster (client_timesheet)
#   0.2.0    the Client timesheet agent and create_timesheet: the hours
#   0.3.0    the ticket lists' settings: No Epics, No Estimates, Abandoned
#   0.4.0    the HRMS server's leave calendar: leave codes and public holidays
#   0.5.0    always mention: who is mentioned on every post in the client's Slack
#   step 7   the three monthly schedules, set by the HR admin on the agent's
#            Schedule tab (a manifest carries no schedule)
manifest_version: 2
plugin_id: client-timesheet
name: Client timesheet
version: 0.5.0
description: Keeps the monthly timesheet a client asks for, for the company's employees placed there - who is who at the client, each person's hours from the client's Jira, and the tickets missing an epic, an estimate or a reason.

connectors:
  - connector_id: jira

tools:
  - builtin:create_timesheet

# The HRMS plugin's own server, named here too: Connect adopts it when it is
# already registered, and approves only the read the timesheet needs. It answers
# as whoever the run acts as, so the HRMS decides whose leave they may see.
mcp_servers:
  - server_id: hrms
    name: HRMS
    auth_mode: signed_identity
    lookup_path: /people/lookup
    tools:
      - get_leave_calendar

# The roster of placed employees, uploaded by a Space Admin; the monthly build
# and its post in the client's Slack. A capability the platform's build carries (EC-D321).
client_timesheet: true

agents:
  - name: Client timesheet
    goal: Build this month's client timesheet from the roster and the client's Jira.
    instructions: |
      You build the client's monthly timesheet. Nobody is watching a run; build
      it and stop.

      THE SETTINGS. Replace each value with your own before the first real run.
      The platform reads these lines, not only you. A remark goes after two
      spaces, in brackets.

        client               = Kulu      (whose timesheet it is: the title and the file's name)
        vendor               = Hamon     (the Vendor column: what the client calls us)
        timezone             = Asia/Kolkata   (the day each worklog counts on)
        most hours in a day  = 8         (above it, a day is an autolog to correct)
        projects             = CPP, IN, WP, PS, ESM, MT   (where No Epics and Abandoned look)
        estimates needed in  = CPP, IN, ESM, IAM, PLT, MT  (where No Estimates looks)
        epic not needed for projects  = PS, ESM          (listed, with that reason)
        epic not needed for summaries = [PROD], [UAT]    (listed, with that reason)
        abandoned            = Abandoned  (the statuses that mean a ticket was dropped)
        leave codes          = Casual leave V, Sick leave S, Floating leave V   (each HRMS leave type's code)
        always mention       = manjusha.m-issac@kulu.com, vandana.girishkumar@kulu.com   (mentioned on every post in the client's Slack)

      **The platform builds the timesheet.** It reads the roster and the
      client's Jira and writes every value. Call create_timesheet once, with no
      values. Give it a month (as 2026-08) only when you were asked for a
      particular month; otherwise it builds the month holding yesterday.

      If create_timesheet says the settings or the roster can't be used, stop
      and say what it said: a person must fix them, and a timesheet you wrote
      yourself would be the wrong one.

      Finish your reply with the two sentences create_timesheet answers with.
      Do not repeat the timesheet: the person opens it.
    tools:
      - builtin:create_timesheet
