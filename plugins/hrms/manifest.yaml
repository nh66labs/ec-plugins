# HRMS: answers leave and holiday questions from the company's HRMS, as the
# person asking. Its tools live on the plugin's own MCP server
# (plugins/hrms/mcp-server/, run beside the platform), which forwards each call
# to the HRMS with the signed identity of whoever asked — so the HRMS, not the
# platform, decides what they may see.
manifest_version: 2
plugin_id: hrms
name: HRMS
version: 0.20.0
description: Takes and decides leave requests, takes work-from-home and comp-off requests, answers leave and holiday questions, gives an HRMS administrator an employee's leave trend, and helps people set their quarterly MBOs, in the company's HRMS — as the person asking.

# What a person says about themselves while setting MBOs — their interests, what
# they want to grow into, what they have achieved — kept in a memory of their
# own that only they can read, and read back next quarter. The platform's
# recall_about_me and remember_about_me, offered in Spaces this plugin is in.
personal_memory: true

mcp_servers:
  - server_id: hrms
    name: HRMS
    auth_mode: signed_identity
    lookup_path: /people/lookup
    tools:
      # Reads: run in the turn.
      - get_leave_context
      - start_leave_request
      - start_wfh_request
      - preview_wfh
      - start_comp_off_request
      - preview_comp_off
      - get_holidays
      - get_my_leave_balance
      - list_my_leaves
      - preview_leave
      - list_leave_requests_to_decide
      - get_leave_request_impact
      - get_leave_trend
      - get_my_mbo_context
      - get_my_mbo_plan
      # Writes: each proposed to the person, and run only once they confirm.
      - apply_leave
      - apply_wfh
      - apply_comp_off
      - cancel_my_leave
      - approve_leave
      - reject_leave
      - save_my_mbo_plan
