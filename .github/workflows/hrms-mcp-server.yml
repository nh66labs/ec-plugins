# The HRMS plugin's MCP server: lint, test and build its image. Publishing the
# image waits on choosing a container registry; until then CI proves it builds.
name: hrms-mcp-server

on:
  push:
    branches: [main]
    paths: ["plugins/hrms/mcp-server/**", ".github/workflows/hrms-mcp-server.yml"]
  pull_request:
    paths: ["plugins/hrms/mcp-server/**", ".github/workflows/hrms-mcp-server.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/hrms/mcp-server

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: The image builds
        run: docker build -t hrms-mcp-server:ci .
